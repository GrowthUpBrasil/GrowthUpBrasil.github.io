<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowthUP+ | Em Manutenção</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            red: '#FF2A2A',
                            dark: '#8B0000',
                            glow: 'rgba(255, 42, 42, 0.6)'
                        },
                        black: {
                            base: '#050505',
                            panel: '#0a0a0a'
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-neon': 'pulse-neon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'flicker': 'flicker 3s linear infinite',
                        'scanline': 'scanline 8s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'pulse-neon': {
                            '0%, 100%': { 
                                opacity: 1, 
                                filter: 'drop-shadow(0 0 15px rgba(255, 42, 42, 0.8)) drop-shadow(0 0 30px rgba(255, 42, 42, 0.4))' 
                            },
                            '50%': { 
                                opacity: 0.8, 
                                filter: 'drop-shadow(0 0 5px rgba(255, 42, 42, 0.5)) drop-shadow(0 0 10px rgba(255, 42, 42, 0.2))' 
                            },
                        },
                        flicker: {
                            '0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100%': {
                                opacity: 1,
                                filter: 'drop-shadow(0 0 10px rgba(255, 42, 42, 0.8))'
                            },
                            '20%, 21.999%, 63%, 63.999%, 65%, 69.999%': {
                                opacity: 0.4,
                                filter: 'none'
                            }
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100vh)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(255, 42, 42, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            margin: 0;
            overflow-x: hidden;
        }

        /* Subtle LED Grid Background */
        .led-grid {
            position: fixed;
            inset: 0;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 42, 42, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 42, 42, 0.03) 1px, transparent 1px);
            z-index: 0;
            pointer-events: none;
        }
        
        /* Neon Panel Box */
        .neon-panel {
            background: linear-gradient(145deg, #0a0a0a, #050505);
            border: 1px solid rgba(255, 42, 42, 0.2);
            box-shadow: 
                0 0 20px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(255, 42, 42, 0.05),
                0 0 15px rgba(255, 42, 42, 0.1);
            position: relative;
        }

        .neon-panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(45deg, transparent, rgba(255, 42, 42, 0.3), transparent);
            z-index: -1;
            border-radius: inherit;
            filter: blur(5px);
        }

        /* Red G Logo Gradient exactly like the image */
        .logo-g-bg {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 40%, #991b1b 100%);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
        }

        /* Neon Text Utilities */
        .text-neon-glow {
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.8), 0 0 20px rgba(255, 42, 42, 0.4);
        }
    </style>
</head>

<body class="min-h-screen text-slate-200 flex flex-col justify-center items-center p-4 sm:p-8 font-sans selection:bg-neon-red selection:text-white relative">

    <div class="led-grid"></div>
    <div class="fixed top-0 left-0 w-full h-1 bg-neon-red shadow-[0_0_15px_#FF2A2A] z-50"></div>
    <!-- Scanline effect -->
    <div class="fixed inset-0 w-full h-[5px] bg-neon-red/10 animate-scanline pointer-events-none z-40 blur-[2px]"></div>

    <main class="neon-panel w-full max-w-2xl rounded-3xl p-8 sm:p-12 z-10 text-center animate-float flex flex-col items-center">
        
        <!-- Reconstructed Logo Section -->
        <div class="mb-12 flex flex-col items-center gap-6">
            <div class="flex items-center gap-4 select-none">
                <!-- 'G' Icon Block -->
                <div class="logo-g-bg w-14 h-14 sm:w-16 sm:h-16 rounded-[14px] flex items-center justify-center shrink-0 border border-red-400/30">
                    <span class="text-white text-3xl sm:text-4xl font-bold tracking-tighter" style="font-family: Arial, Helvetica, sans-serif;">G</span>
                </div>
                
                <!-- 'GrowthUP+' Text -->
                <h1 class="text-4xl sm:text-5xl font-bold text-white tracking-wide flex items-center">
                    GrowthUP<span class="text-neon-red font-bold animate-pulse-neon ml-1 text-5xl">+</span>
                </h1>
            </div>
            <div class="h-[1px] w-3/4 bg-gradient-to-r from-transparent via-neon-red/30 to-transparent"></div>
        </div>

        <!-- Illustration / Animated LED Gears -->
        <div class="relative w-32 h-32 mb-10 flex justify-center items-center">
            <!-- Outer spinning glowing circle -->
            <svg class="absolute inset-0 w-full h-full text-neon-red/40 animate-spin-slow drop-shadow-[0_0_10px_rgba(255,42,42,0.5)]" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="15 10 5 10" />
                <circle cx="50" cy="50" r="38" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5"/>
            </svg>
            
            <!-- Inner glowing icon -->
            <div class="text-neon-red animate-flicker">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                    <circle cx="12" cy="12" r="4"/>
                </svg>
            </div>
        </div>

        <!-- Main Message -->
        <h2 class="text-2xl sm:text-3xl font-bold text-white mb-4 tracking-wide text-neon-glow">
            SISTEMA EM MANUTENÇÃO
        </h2>
        
        <p class="text-gray-400 text-sm sm:text-base mb-10 max-w-md leading-relaxed">
            Nossos servidores estão passando por um upgrade de performance. Em breve a plataforma retornará com força total para acelerar o seu crescimento.
        </p>

        <!-- LED Progress Bar Indicator -->
        <div class="w-full max-w-sm mx-auto">
            <div class="flex justify-between text-xs font-mono text-gray-500 mb-2 px-1 uppercase tracking-wider">
                <span>Status da Atualização</span>
                <span class="text-neon-red font-bold text-neon-glow">Sys.Upgrading [85%]</span>
            </div>
            
            <!-- Outer Track -->
            <div class="h-3 w-full bg-black/80 rounded-sm p-[2px] border border-neon-red/20 shadow-[inset_0_0_5px_rgba(0,0,0,1)]">
                <!-- Inner Neon Bar -->
                <div class="h-full bg-neon-red w-[85%] relative overflow-hidden shadow-[0_0_10px_#FF2A2A]">
                    <!-- LED Segment Effect inside the bar -->
                    <div class="absolute inset-0 w-full h-full" style="background-image: linear-gradient(to right, transparent 80%, rgba(0,0,0,0.3) 100%); background-size: 10px 100%;"></div>
                    <!-- Moving light reflection -->
                    <div class="absolute top-0 left-0 w-full h-1 bg-white/40"></div>
                </div>
            </div>
        </div>
        
    </main>

    <!-- Tech Footer -->
    <footer class="mt-12 font-mono text-gray-600 text-xs sm:text-sm z-10 text-center tracking-widest">
        <p>SYS_VER_2.0 <span class="mx-2 text-neon-red/50">|</span> &copy; <span id="year"></span> GROWTHUP+</p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
