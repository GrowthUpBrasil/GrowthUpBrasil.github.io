</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- LENIS SCROLL SETUP (Otimizado) ---
        // Implementa a rolagem suave "pesada" para evitar que o usuário role rápido demais
        const useLenis = () => {
            useEffect(() => {
                if (typeof Lenis !== 'undefined') { // Garante que o Lenis carregou
                    const lenis = new Lenis({
                        duration: 1.8, // Aumentei a duração para deixar ainda mais "pesado/suave"
                        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                        direction: 'vertical',
                        gestureDirection: 'vertical',
                        smooth: true,
                        mouseMultiplier: 0.8, // Diminui a velocidade do mouse
                        smoothTouch: false, // Desativa no touch para performance mobile nativa
                        touchMultiplier: 1.5,
                    });

                    function raf(time) {
                        lenis.raf(time);
                        requestAnimationFrame(raf);
                    }

                    requestAnimationFrame(raf);

                    return () => lenis.destroy();
                }
            }, []);
        };

        const Icons = {
            Play: (props) => <svg {...props} width="24" height="24" viewBox="0 0 24 24" fill={props.fill || "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Monitor: (props) => <svg {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>,
            Zap: (props) => <svg {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
            Tv: (props) => <svg {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>,
            Layers: (props) => <svg {...props} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>,
            WhatsApp: (props) => <svg {...props} viewBox="0 0 24 24" fill={props.fill || "currentColor"} xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z" /></svg>
        };

        const trackLead = () => { if (typeof fbq === 'function') { fbq('track', 'Lead', { content_name: 'WhatsApp Click', content_category: 'Contato', value: 1, currency: 'BRL' }); } };
        const trackInitiateCheckout = (planName, value) => { if (typeof fbq === 'function') { fbq('track', 'InitiateCheckout', { content_name: `Plano ${planName}`, value: value, currency: 'BRL' }); } };

        const CustomCheck = ({ color = "green" }) => {
            const strokeColor = color === "green" ? "#22c55e" : "#ef4444"; 
            return (<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" className="mt-0.5 flex-shrink-0"><path d="M5 13L9 17L19 7" stroke={strokeColor} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>);
        };

        // Otimização: Observer único para reduzir listeners
        const RevealOnScroll = ({ children, delay = 0, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);
            
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => { 
                    if (entry.isIntersecting) { 
                        setIsVisible(true); 
                        observer.unobserve(entry.target); 
                    } 
                }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
                
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (<div ref={ref} className={`reveal-element ${isVisible ? 'visible' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</div>);
        };

        const UpsideDownSpores = () => {
            // Otimização: Memoização para não recalcular em re-renders
            const spores = useMemo(() => Array.from({ length: 30 }).map((_, i) => ({ id: i, left: Math.random() * 100, size: Math.random() * 3 + 1, duration: Math.random() * 10 + 10, delay: Math.random() * 5 })), []);
            return (<div className="spores-container">{spores.map((s) => (<div key={s.id} className="spore" style={{ left: `${s.left}%`, width: `${s.size}px`, height: `${s.size}px`, animationDuration: `${s.duration}s`, animationDelay: `-${s.delay}s` }}></div>))}</div>);
        };

        const InstallAppSection = () => {
            return (
                <div className="w-full bg-black py-20 border-t border-white/5 relative z-20">
                    <div className="container mx-auto px-6">
                        <RevealOnScroll className="text-center mb-16">
                            <p className="text-[10px] md:text-xs text-gray-500 uppercase tracking-[0.2em] mb-4 font-medium">Faça o Download</p>
                            <h1 className="text-3xl md:text-5xl lg:text-6xl font-medium text-white leading-tight max-w-4xl mx-auto">Instale o <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-800 animate-pulse font-bold mx-2">Nosso APP</span> na sua SmartTV/Celular ou qualquer outro dispositivo.</h1>
                        </RevealOnScroll>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-y-10 gap-x-12 items-center justify-items-center text-white">

                            <div className="group flex items-center justify-center gap-2 cursor-pointer transform transition-all duration-300 hover:scale-110"><span className="text-xl font-medium transition-colors">Android</span><i className="fa-brands fa-android text-2xl transition-colors"></i></div>
                            <div className="group flex items-center justify-center gap-2 cursor-pointer transform transition-all duration-300 hover:scale-110"><span className="text-2xl font-bold transition-colors">LG</span></div>
                            <div className="group flex items-center justify-center cursor-pointer transform transition-all duration-300 hover:scale-110"><span className="roku-font text-2xl transition-colors">Roku</span></div>
                            <div className="group flex items-center justify-center gap-2 cursor-pointer transform transition-all duration-300 hover:scale-110"><i className="fa-brands fa-apple text-3xl transition-colors"></i><span className="text-xl font-medium transition-colors">Apple</span></div>
                            <div className="group flex items-center justify-center cursor-pointer transform transition-all duration-300 hover:scale-110"><i className="fa-brands fa-amazon text-3xl mt-2 transition-colors"></i></div>
                            <div className="group col-span-2 md:col-span-1 flex items-center justify-center gap-2 cursor-pointer transform transition-all duration-300 hover:scale-110"><i className="fa-brands fa-chrome text-2xl transition-colors"></i><span className="text-xl font-medium transition-colors">Browser</span></div>
                        </div>
                        <p className="text-center text-xs text-gray-600 mt-12 font-medium tracking-wide uppercase">Compatível com as principais plataformas do mercado.</p>
                    </div>
                </div>
            );
        };

        const AppShowcaseSection = () => {
            const [gifActive, setGifActive] = useState(false);
            const [videoUrl, setVideoUrl] = useState(null);
            const [activeTooltip, setActiveTooltip] = useState(null);

            const mainScrollRef = useRef(null);
            const horizontalScrollRef1 = useRef(null);
            const horizontalScrollRef2 = useRef(null);

            const toggleTooltip = (id) => {
                setActiveTooltip(activeTooltip === id ? null : id);
                if (activeTooltip !== id) {
                    setTimeout(() => setActiveTooltip(null), 3000);
                }
            };

            const openVideo = (videoId) => {
                setVideoUrl(`https://www.youtube.com/embed/${videoId}?autoplay=1`);
            };
            const closeVideo = () => {
                setVideoUrl(null);
            };

            // Otimização: Touch/Mouse handlers fora do render para evitar recriação
            useEffect(() => {
                const mainScroller = mainScrollRef.current;
                const sliders = [horizontalScrollRef1.current, horizontalScrollRef2.current];
                const allDraggables = [mainScroller, ...sliders].filter(Boolean);

                let isDown = false;
                let startX, startY;
                let mainScrollStart;
                let horizontalScrollStart = new Map();
                let targetSlider = null;
                let hasDragged = false;

                const initDrag = (x, y, target) => {
                    isDown = true;
                    hasDragged = false;
                    startX = x;
                    startY = y;
                    mainScrollStart = mainScroller.scrollTop;

                    if (target.classList.contains('horizontal-scroll')) {
                        targetSlider = target;
                        horizontalScrollStart.set(target, target.scrollLeft);
                    } else {
                        targetSlider = null;
                    }
                };

                const endDrag = () => {
                    isDown = false;
                    if (mainScroller) mainScroller.classList.remove('scroll-active');
                    targetSlider = null;
                };

                const performMove = (x, y, e) => {
                    if (!isDown) return;
                    
                    const walkY = (y - startY) * 1.5; 
                    const walkX = (x - startX) * 1.5; 

                    if (Math.abs(x - startX) > 5 || Math.abs(y - startY) > 5) {
                        hasDragged = true;
                        if (mainScroller) mainScroller.classList.add('scroll-active');
                    }

                    if (Math.abs(walkY) > Math.abs(walkX)) {
                        if (mainScroller) mainScroller.scrollTop = mainScrollStart - walkY;
                    } else {
                        if (targetSlider) {
                            const startLeft = horizontalScrollStart.get(targetSlider);
                            targetSlider.scrollLeft = startLeft - walkX;
                        }
                    }
                };

                const handleMouseDown = (e) => { e.stopPropagation(); initDrag(e.pageX, e.pageY, e.currentTarget); };
                const handleTouchStart = (e) => { e.stopPropagation(); const touch = e.touches[0]; initDrag(touch.pageX, touch.pageY, e.currentTarget); };
                const handleMouseMove = (e) => { if (!isDown) return; e.preventDefault(); performMove(e.pageX, e.pageY, e); };
                const handleTouchMove = (e) => { if (!isDown) return; if (e.cancelable) e.preventDefault(); const touch = e.touches[0]; performMove(touch.pageX, touch.pageY, e); };

                allDraggables.forEach(el => { el.addEventListener('mousedown', handleMouseDown); el.addEventListener('touchstart', handleTouchStart, { passive: false }); });
                document.addEventListener('mousemove', handleMouseMove); document.addEventListener('touchmove', handleTouchMove, { passive: false });
                document.addEventListener('mouseup', endDrag); document.addEventListener('mouseleave', endDrag); document.addEventListener('touchend', endDrag);

                return () => {
                    allDraggables.forEach(el => { el.removeEventListener('mousedown', handleMouseDown); el.removeEventListener('touchstart', handleTouchStart); });
                    document.removeEventListener('mousemove', handleMouseMove); document.removeEventListener('touchmove', handleTouchMove);
                    document.removeEventListener('mouseup', endDrag); document.removeEventListener('mouseleave', endDrag); document.removeEventListener('touchend', endDrag);
                };
            }, []);

            return (
                <section className="app-section">
                    <div className="app-phone">

                                            </div>

                                                <i className="fa-solid fa-user-circle"></i>
                                                <div className="user-tooltip">Logo logo você terá seu acesso! 😄</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className={`video-overlay ${videoUrl ? 'active' : ''}`}>
                                        <button className="close-video-btn" onClick={closeVideo}><i className="fa-solid fa-xmark"></i></button>
                                        <div className="video-container">
                                            {videoUrl && <iframe src={videoUrl} frameBorder="0" allow="autoplay; encrypted-media" allowFullScreen></iframe>}
                                        </div>
                                    </div>
                                    <div className="app-ui-scroll-content" ref={mainScrollRef}>
                                        <div className="app-hero-banner">
                                            {/* Otimização: Carregamento Lazy para o GIF */}
                                            <div className={`hero-gif-container ${gifActive ? 'active' : ''}`}><img src="https://i.pinimg.com/originals/a1/5a/b9/a15ab9f44fb47ab505b5a92ab5f98ed8.gif" alt="Futebol GIF" loading="lazy" /></div>
                                            <div className="app-hero-overlay"></div>
                                            <div className={`play-btn-app ${gifActive ? 'hidden' : ''}`} onClick={() => setGifActive(true)}><i className="fa-solid fa-play"></i></div>
                                            <div className="hero-info">
                                                <span className="hero-tag">Ao Vivo Agora</span>
                                                <h3 className="hero-title">Champions League</h3>
                                                <div className="hero-meta"><span><i className="fa-regular fa-clock"></i> 2º Tempo</span><span>• Final</span><span>• 4K HDR</span></div>
                                            </div>
                                        </div>
                                        <div className="app-section-title">Destaques da Semana</div>
                                        <div className="movies-row horizontal-scroll" ref={horizontalScrollRef1}>
                                            <div className="movie-card-app" onClick={() => openVideo('qnR0s1QVknI')}><div className="movie-poster-app"><img src="https://jardimdasamericas.com.br/uploads/2025/12/capa-filme-avatar-fogo-e-cinzas-966f9-large.png" alt="Avatar" loading="lazy"/></div><span className="movie-title-text">Avatar: Fogo e Cinzas</span></div>

                                            <div className="movie-card-app" onClick={() => openVideo('T7_zMl_ZhdQ')}><div className="movie-poster-app"><img src="https://s2-g1.glbimg.com/JlPpzZaM6BQeHE8519IeNARgIJg=/0x0:1382x2048/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_59edd422c0c84a879bd37670ae4f538a/internal_photos/bs/2021/k/m/sUy6NaRMiAMJOllVxvOQ/fb2miibwyairfgo.jpg" alt="Batman" loading="lazy"/></div><span className="movie-title-text">The Batman II</span></div>
                                            <div className="movie-card-app" onClick={() => openVideo('ZiDphkXCZsQ')}><div className="movie-poster-app"><img src="https://ingresso-a.akamaihd.net/prd/img/movie/f1-o-filme/3a0a118e-8bf3-4e10-b45d-f028cd49b001.webp" alt="F1" loading="lazy"/></div><span className="movie-title-text">F1: O Filme</span></div>

                                            <div className="movie-card-app" onClick={() => openVideo('Wb3kaP580kA')}><div className="movie-poster-app"><img src="https://i.imgur.com/30zW0QK.png" alt="Stranger Things" loading="lazy"/></div><span className="movie-title-text">Stranger Things 5</span></div>
                                            <div className="movie-card-app" onClick={() => openVideo('IgyahanUcOk')}><div className="movie-poster-app"><img src="https://preview.redd.it/tvn-spring-fever-teaser-poster-premieres-january-5-v0-kgb43b5drv4g1.jpg?width=640&crop=smart&auto=webp&s=4d0318de16fd82a564657498104302df46ef8b16" alt="Spring Fever" loading="lazy"/></div><span className="movie-title-text">Spring Fever</span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div className="app-content">
                        <div className="app-logo"></div>
                        <h2 className="app-title">Para curtir <span>onde</span><br/>e <span>quando</span> quiser</h2>
                        <p className="app-text">Tenha acesso completo direto no seu celular. Assista filmes, séries, canais e esportes ao vivo com total liberdade. Disponível para Android e iOS.</p>
