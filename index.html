0 text-sm mt-2 tracking-widest">Clique para tocar</p></div></div><div className="absolute top-0 right-0 w-2/3 h-full bg-gradient-to-l from-white/5 to-transparent skew-x-[-20deg]"></div></>) : (<iframe width="100%" height="100%" src={`https://www.youtube.com/embed/${desktopVideoId}?autoplay=1&playsinline=1&rel=0&modestbranding=1`} title="Growth Up Brasil Shorts" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen className="w-full h-full"></iframe>)}</div><div className="h-4 w-1/3 bg-[#333] mx-auto rounded-b-xl mt-1 shadow-lg"></div></div></RevealOnScroll></div></section></div>)}
